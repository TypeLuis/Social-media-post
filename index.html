<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="./main.js"></script>
</head>
<body>
    <div class='container'>
  
      <div class="main active">
        <div class="top">
          <div class="info">
            <img src="" class='profile-image' alt="">
            <div class="person-info">
              <span class='bold' id='userName'></span>
              <span class='italic' id='place'></span>
            </div>
          </div>
          <div class="info-setting clicker">
            ...
          </div>
        </div>
        <div class="middle">
          <img id='image' src="" alt="">
        </div>
        <div class="bottom">
          <div class='icons'>
            <div class="iconDiv"></div>
            <div class="bookmark"></div>
          </div>
          <div>Liked by <span class='bold firstLiked'></span> and <span class='link likes'></span></div>
          <div class='title'></div>
          <div class='gray link comment'>View all <span class='commentLength'></span> comments</div>
          <div class='gray'>2 days ago</div>
        </div>
      </div>
  
      <div class="commentContainer">
        <div class='commentTop'>
          <svg class='icon clicker' id='commentBack' viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#000000" stroke-width="0.12000000000000002">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M15.7071 4.29289C16.0976 4.68342 16.0976 5.31658 15.7071 5.70711L9.41421 12L15.7071 18.2929C16.0976 18.6834 16.0976 19.3166 15.7071 19.7071C15.3166 20.0976 14.6834 20.0976 14.2929 19.7071L7.29289 12.7071C7.10536 12.5196 7 12.2652 7 12C7 11.7348 7.10536 11.4804 7.29289 11.2929L14.2929 4.29289C14.6834 3.90237 15.3166 3.90237 15.7071 4.29289Z" fill="#ffffff"></path>
          </svg>
          <span class='bold'>Comments</span>
          <svg fill="#ffffff" xmlns="http://www.w3.org/2000/svg" class='icon plane clicker' viewBox="-51.2 -51.2 614.40 614.40" transform="matrix(1, 0, 0, 1, 0, 0)rotate(0)" stroke="#ffffff" stroke-width="7.68">
            <path d="M508.645,18.449c-2.929-2.704-7.133-3.51-10.826-2.085L6.715,204.446c-3.541,1.356-6.066,4.515-6.607,8.264 c-0.541,3.75,0.985,7.496,3.995,9.796l152.127,116.747c-0.004,0.116-0.575,0.224-0.575,0.342v83.592 c0,3.851,2.663,7.393,6.061,9.213c1.541,0.827,3.51,1.236,5.199,1.236c2.026,0,4.181-0.593,5.931-1.756l56.12-37.367 l130.369,99.669c1.848,1.413,4.099,2.149,6.365,2.149c1.087,0,2.186-0.169,3.248-0.516c3.27-1.066,5.811-3.672,6.786-6.974 L511.571,29.082C512.698,25.271,511.563,21.148,508.645,18.449z M170.506,321.508c-0.385,0.36-0.7,0.763-1.019,1.163 L31.659,217.272L456.525,54.557L170.506,321.508z M176.552,403.661v-48.454l33.852,25.887L176.552,403.661z M359.996,468.354 l-121.63-93.012c-1.263-1.77-2.975-3.029-4.883-3.733l-47.29-36.163L480.392,60.86L359.996,468.354z"></path>
          </svg>
          </svg>
        </div>
        <div class='commentMiddle scroll'>
          <div class="elementDiv"></div>
        </div>
        <div class='commentBottom'>
          <img class='profile-image' src="https://i.pinimg.com/736x/34/16/65/341665199bb597cdfae9848f975b844f.jpg" alt="">
          <form class='commentForm'>
            <input id='addComment' placeHolder='Add a comment...' type="text" name='comment'>
            <input id='submitComment' class='clicker' type="submit" value="Submit">
          </form>
        </div>
      </div>
  
      <div class="likeContainer">
        <div class="likeTop">
          <div class="heading">
            <svg class='icon clicker' id='likeBack' viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#000000" stroke-width="0.12000000000000002">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M15.7071 4.29289C16.0976 4.68342 16.0976 5.31658 15.7071 5.70711L9.41421 12L15.7071 18.2929C16.0976 18.6834 16.0976 19.3166 15.7071 19.7071C15.3166 20.0976 14.6834 20.0976 14.2929 19.7071L7.29289 12.7071C7.10536 12.5196 7 12.2652 7 12C7 11.7348 7.10536 11.4804 7.29289 11.2929L14.2929 4.29289C14.6834 3.90237 15.3166 3.90237 15.7071 4.29289Z" fill="#ffffff"></path>
            </svg>
            <span>Likes</span>
            <div></div>
          </div>
          <div class="search">
            <input placeHolder='Search' type="text">
          </div>
        </div>
  
        <div class="likesBottom scroll">
          <div class="likesElement">
  
          </div>
        </div>
  
      </div>
  
    </div>
  </body>
</html>
